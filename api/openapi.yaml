openapi: 3.0.1
info:
  contact:
    email: developer.overheid@geonovum.nl
    name: Team developer.overheid.nl
    url: https://github.com/developer-overheid-nl/don-tools-api/issues
  description: |-
    API to access the tools endpoints of developer.overheid.nl.

    ## Auth

    This API provides tools endpoints that can be accessed with either an API key or a client credentials token.

    ### API key

    Using an API key, you can access the tools endpoints.
    These requests can also be made from the browser.
    Request a read-only API key at https://apis.developer.overheid.nl/apis/key-aanvragen.
    Simply pass the obtained API key with each request using the `X-Api-Key` header.

    ### Client credentials token

    Using a client credentials token, you can access the tools endpoints.
    To obtain the token, perform a `POST` request to `https://auth.developer.overheid.nl/realms/don/protocol/openid-connect/token` with the following Form URL Encoded body:
    - `grant_type`: `client_credentials`
    - `scope`: `tools`
    - `client_id`: the client id you received from us
    - `client_secret`: the client secret you received from us

    Pass the obtained token with each request using the `Authorization` header. Example:

    `Authorization`: `Bearer {ACCESS_TOKEN}` (replace `{ACCESS_TOKEN}` with the obtained `access_token`)

    ### Events

    Reading events (`GET /v1/events`) is possible with an API key or with a client credentials token with scope `events:read`.
    Creating, changing and deleting events requires a client credentials token with scope `events:write`.
    Events harvested from Pleio can only be changed at the source; deleting such an event hides it from the agenda.

    ## Pagination

    Pagination of collections is done using the `Link` header.
    Additionally, the headers `Current-Page`, `Per-Page`, `Total-Count` and `Total-Pages` provide extra support for implementing pagination in the client.

    ## Dates and times

    All moments in time are RFC 3339 date-times with a UTC offset, e.g. `2026-10-06T15:30:00+02:00`.
  title: Tools API v1
  version: 1.0.0
servers:
  - description: Production
    url: https://api.developer.overheid.nl/tools/v1
  - description: Test
    url: https://api.don.projects.digilab.network/tools/v1
tags:
  - description: Tools API V1 routes
    name: API v1
  - description: Conversies en hulpmiddelen
    name: Tools
  - description: Agenda met (developer) events, handmatig beheerd en geharvest uit Pleio
    name: Events
paths:
  /v1/arazzo/markdown:
    post:
      description: 'Genereert alleen de Markdown-uitvoer van een Arazzo specificatie. Body: { oasUrl|oasBody }'
      operationId: arazzoMarkdown
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OasInput'
      responses:
        '200':
          content:
            text/markdown:
              schema:
                type: string
          description: OK
          headers:
            API-Version:
              description: De API-versie van de response
              explode: false
              schema:
                type: string
              style: simple
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
        - clientCredentials: []
      summary: Arazzo Markdown (POST)
      tags:
        - Tools
      x-eov-operation-handler: controllers/ToolsController
  /v1/arazzo/mermaid:
    post:
      description: 'Genereert alleen de Mermaid flowchart van een Arazzo specificatie. Body: { oasUrl|oasBody }'
      operationId: arazzoMermaid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OasInput'
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: OK
          headers:
            API-Version:
              description: De API-versie van de response
              explode: false
              schema:
                type: string
              style: simple
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
        - clientCredentials: []
      summary: Arazzo Mermaid (POST)
      tags:
        - Tools
      x-eov-operation-handler: controllers/ToolsController
  /v1/auth/clients:
    post:
      description: Maak een client aan via de admin API. Body bevat Email.
      operationId: untrustClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UntrustClientInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsKeycloakClientResult'
          description: OK
          headers:
            API-Version:
              description: De API-versie van de response
              explode: false
              schema:
                type: string
              style: simple
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
        - clientCredentials: []
      summary: Maak client (POST)
      tags:
        - Tools
      x-eov-operation-handler: controllers/ToolsController
  /v1/oas/convert:
    post:
      description: 'Converteert OpenAPI naar de laatst ondersteunde versie (standaard 3.1). Meegegeven targetVersion (3.0 of 3.1) bepaalt het doel. Body: { oasUrl } of { oasBody } (stringified JSON of YAML).'
      operationId: convertOAS
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OasInput'
      responses:
        '200':
          description: OK
          headers:
            API-Version:
              description: De API-versie van de response
              explode: false
              schema:
                type: string
              style: simple
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
        - clientCredentials: []
      summary: Converteer OpenAPI 3.0/3.1
      tags:
        - Tools
      x-eov-operation-handler: controllers/ToolsController
      x-original-operationId: ConvertOAS
  /v1/oas/bundle:
    post:
      description: 'Bundelt een OpenAPI specificatie en lost externe verwijzingen op. Body: { oasUrl } of { oasBody }.'
      operationId: bundleOAS
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OasInput'
      responses:
        '200':
          description: OK
          headers:
            API-Version:
              description: De API-versie van de response
              explode: false
              schema:
                type: string
              style: simple
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
        - clientCredentials: []
      summary: Bundle OpenAPI
      tags:
        - Tools
      x-eov-operation-handler: controllers/ToolsController
  /v1/oas/generate:
    post:
      description: 'Genereert een boilerplate OpenAPI specificatie op basis van JSON-invoer. Body: { oasUrl } of { oasBody } (stringified JSON).'
      operationId: generateOAS
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OasInput'
      responses:
        '200':
          description: OK
          headers:
            API-Version:
              description: De API-versie van de response
              explode: false
              schema:
                type: string
              style: simple
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
        - clientCredentials: []
      summary: Generate OpenAPI
      tags:
        - Tools
      x-eov-operation-handler: controllers/ToolsController
      x-original-operationId: GenerateOAS
  /v1/oas/validate:
    post:
      description: 'Valideert een OpenAPI specificatie met de DON ADR ruleset. Standaard wordt ruleset 2.1 gebruikt; geef targetVersion "2.0" of "2.1" mee om een versie te kiezen. Body: { oasUrl } of { oasBody } (stringified JSON of YAML).'
      operationId: validatorOpenAPIPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OasInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsLintResult'
          description: OK
          headers:
            API-Version:
              description: De API-versie van de response
              explode: false
              schema:
                type: string
              style: simple
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
        - clientCredentials: []
      summary: Validate OpenAPI (POST)
      tags:
        - Tools
      x-eov-operation-handler: controllers/ToolsController
  /v1/events:
    get:
      description: Geeft de events uit de agenda, gesorteerd op begintijd (oplopend).
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/EndsAfter'
        - $ref: '#/components/parameters/StartsBefore'
        - $ref: '#/components/parameters/EventSourceFilter'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgendaEvent'
                type: array
          description: OK
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
            Link:
              $ref: '#/components/headers/Link'
            Total-Count:
              $ref: '#/components/headers/Total-Count'
            Current-Page:
              $ref: '#/components/headers/Current-Page'
            Per-Page:
              $ref: '#/components/headers/Per-Page'
            Total-Pages:
              $ref: '#/components/headers/Total-Pages'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - apiKey: []
        - clientCredentials:
            - events:read
      summary: Lijst events
      tags:
        - Events
    post:
      description: Voegt een handmatig beheerd event toe aan de agenda.
      operationId: createEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaEventInput'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaEvent'
          description: Created
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - clientCredentials:
            - events:write
      summary: Maak event
      tags:
        - Events
  /v1/events/{id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      description: Geeft een event uit de agenda.
      operationId: getEvent
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaEvent'
          description: OK
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - apiKey: []
        - clientCredentials:
            - events:read
      summary: Haal event op
      tags:
        - Events
    put:
      description: Vervangt een handmatig beheerd event. Geharveste events kunnen alleen bij de bron worden gewijzigd.
      operationId: updateEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaEventInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaEvent'
          description: OK
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - clientCredentials:
            - events:write
      summary: Wijzig event
      tags:
        - Events
    delete:
      description: Verwijdert een handmatig beheerd event. Een geharvest event wordt verborgen, zodat een volgende harvest het niet terugzet.
      operationId: deleteEvent
      responses:
        '204':
          description: No Content
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - clientCredentials:
            - events:write
      summary: Verwijder event
      tags:
        - Events
  /v1/oas/postman:
    post:
      description: 'Converteert OpenAPI naar Postman Collection JSON. Body: { oasUrl } of { oasBody } (stringified JSON of YAML).'
      operationId: createPostmanCollection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OasInput'
      responses:
        '200':
          description: OK
          headers:
            API-Version:
              description: De API-versie van de response
              explode: false
              schema:
                type: string
              style: simple
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
        - clientCredentials: []
      summary: Maak Postman-collectie (POST)
      tags:
        - Tools
      x-eov-operation-handler: controllers/ToolsController
      x-original-operationId: CreatePostmanCollection
components:
  headers:
    API-Version:
      description: De API-versie van de response
      explode: false
      schema:
        example: 1.0.0
        type: string
      style: simple
    Link:
      description: Links naar de eerste, vorige, volgende en laatste pagina
      schema:
        example: <https://api.developer.overheid.nl/tools/v1/events?page=2&perPage=20>; rel="next"
        type: string
    Location:
      description: URI van de aangemaakte resource
      schema:
        example: https://api.developer.overheid.nl/tools/v1/events/0f8d3c1e-7a3b-4f5e-9b1a-2c6d4e8f0a12
        format: uri
        type: string
    Total-Count:
      description: Totaal aantal items
      schema:
        example: 124
        type: integer
    Current-Page:
      description: Huidige pagina
      schema:
        example: 1
        type: integer
    Per-Page:
      description: Aantal items per pagina
      schema:
        example: 20
        type: integer
    Total-Pages:
      description: Totaal aantal pagina's
      schema:
        example: 7
        type: integer
  parameters:
    Page:
      description: Paginanummer (begint bij 1).
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
    PerPage:
      description: Aantal resultaten per pagina.
      in: query
      name: perPage
      required: false
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
    EndsAfter:
      description: Alleen events die op of na dit moment eindigen. Gebruik het huidige moment voor aankomende en lopende events.
      in: query
      name: endsAfter
      required: false
      schema:
        example: '2026-09-24T00:00:00+02:00'
        format: date-time
        type: string
    StartsBefore:
      description: Alleen events die vóór dit moment beginnen.
      in: query
      name: startsBefore
      required: false
      schema:
        example: '2027-01-01T00:00:00+01:00'
        format: date-time
        type: string
    EventSourceFilter:
      description: Alleen events uit deze bron.
      in: query
      name: source
      required: false
      schema:
        $ref: '#/components/schemas/AgendaEventSource'
    EventId:
      description: Id van het event.
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
  responses:
    '404':
      description: Resource does not exist
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemJson'
      description: Bad request
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemJson'
      description: Resource does not exist
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemJson'
      description: Conflict with the current state of the resource
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
    ServiceUnavailable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemJson'
      description: Service unavailable
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
  schemas:
    ProblemJson:
      properties:
        detail:
          type: string
        errors:
          items:
            properties:
              code:
                type: string
              detail:
                type: string
              in:
                type: string
              location:
                type: string
            type: object
          type: array
        status:
          type: integer
        title:
          type: string
      type: object
    AgendaEventSource:
      description: Herkomst van het event. `manual` is via deze API beheerd, `pleio` is geharvest uit een Pleio-site.
      enum:
        - manual
        - pleio
      example: manual
      type: string
    AgendaEventInput:
      properties:
        title:
          example: PGDay Lowlands 2026
          maxLength: 300
          minLength: 1
          type: string
        summary:
          example: PostgreSQL-conferentie van PostgreSQL Europe, voor developers en databaseprofessionals.
          maxLength: 2000
          type: string
        startsAt:
          description: Begin van het event (RFC 3339 met UTC-offset).
          example: '2026-09-10T09:00:00+02:00'
          format: date-time
          type: string
        endsAt:
          description: Einde van het event (RFC 3339 met UTC-offset). Mag niet vóór `startsAt` liggen.
          example: '2026-09-10T17:00:00+02:00'
          format: date-time
          type: string
        location:
          example: TivoliVredenburg, Utrecht
          maxLength: 300
          type: string
        url:
          description: Pagina met meer informatie over het event.
          example: https://2026.pgday.nl/
          format: uri
          maxLength: 2000
          type: string
      required:
        - title
        - startsAt
        - endsAt
        - url
      type: object
    AgendaEvent:
      allOf:
        - $ref: '#/components/schemas/AgendaEventInput'
        - properties:
            id:
              example: 0f8d3c1e-7a3b-4f5e-9b1a-2c6d4e8f0a12
              format: uuid
              type: string
            source:
              $ref: '#/components/schemas/AgendaEventSource'
            sourceName:
              description: Naam van de bron, bijvoorbeeld de host van de Pleio-site.
              example: digilab.pleio.nl
              type: string
            createdAt:
              example: '2026-09-01T08:00:00+02:00'
              format: date-time
              type: string
            updatedAt:
              example: '2026-09-02T10:15:00+02:00'
              format: date-time
              type: string
          required:
            - id
            - source
            - createdAt
            - updatedAt
          type: object
    OasInput:
      example:
        oasUrl: oasUrl
        oasBody: oasBody
        targetVersion: '3.1'
      properties:
        oasBody:
          type: string
        oasUrl:
          type: string
        targetVersion:
          description: 'Doelversie. Voor conversie: 3.0 of 3.1. Voor validatie: 2.0 of 2.1.'
          type: string
      type: object
    ModelsKeycloakClientResult:
      example:
        apiKey: apiKey
      properties:
        apiKey:
          type: string
      type: object
    ModelsLintMessage:
      example:
        severity: severity
        createdAt: '2000-01-23T04:56:07.000Z'
        code: code
        id: id
        infos:
          - path: path
            lintMessageId: lintMessageId
            id: id
            message: message
          - path: path
            lintMessageId: lintMessageId
            id: id
            message: message
      properties:
        code:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        infos:
          items:
            $ref: '#/components/schemas/ModelsLintMessageInfo'
          type: array
        severity:
          type: string
      type: object
    ModelsLintMessageInfo:
      example:
        path: path
        lintMessageId: lintMessageId
        id: id
        message: message
      properties:
        id:
          type: string
        lintMessageId:
          type: string
        message:
          type: string
        path:
          type: string
      type: object
    ModelsLintResult:
      example:
        createdAt: '2000-01-23T04:56:07.000Z'
        score: 6
        failures: 0
        successes: true
        rulesetVersion: '2.1'
        messages:
          - severity: severity
            createdAt: '2000-01-23T04:56:07.000Z'
            code: code
            id: id
            infos:
              - path: path
                lintMessageId: lintMessageId
                id: id
                message: message
              - path: path
                lintMessageId: lintMessageId
                id: id
                message: message
          - severity: severity
            createdAt: '2000-01-23T04:56:07.000Z'
            code: code
            id: id
            infos:
              - path: path
                lintMessageId: lintMessageId
                id: id
                message: message
              - path: path
                lintMessageId: lintMessageId
                id: id
                message: message
        id: id
        apiId: apiId
      properties:
        apiId:
          type: string
        createdAt:
          format: date-time
          type: string
        failures:
          format: int32
          type: integer
        id:
          type: string
        messages:
          items:
            $ref: '#/components/schemas/ModelsLintMessage'
          type: array
        score:
          format: int32
          type: integer
        successes:
          type: boolean
        rulesetVersion:
          description: De gebruikte ruleset-versie voor validatie.
          type: string
      type: object
    UntrustClientInput:
      example:
        email: email
      properties:
        email:
          type: string
      type: object
  securitySchemes:
    apiKey:
      in: header
      name: X-Api-Key
      type: apiKey
      description: Read-only API keys for tools endpoints can be requested at https://apis.developer.overheid.nl/apis/key-aanvragen.
    clientCredentials:
      flows:
        clientCredentials:
          scopes:
            tools: Access to tools endpoints
            events:read: Read events
            events:write: Create, change and delete events
          tokenUrl: https://auth.developer.overheid.nl/realms/don/protocol/openid-connect/token
      type: oauth2
