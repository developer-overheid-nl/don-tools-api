# Local PostgreSQL for the events agenda: docker compose up -d
# db/*.sql is applied automatically on the first start (empty volume); after a schema change run
# `docker compose down -v` to start over, or apply the new file with psql.
services:
  db:
    image: postgres:17.0-alpine
    container_name: don-tools-postgres
    environment:
      POSTGRES_USER: don
      POSTGRES_PASSWORD: don
      POSTGRES_DB: don_events
    # 5433, so it can run next to the Postgres of the registers (5432).
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U don -d don_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
