name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    uses: developer-overheid-nl/.github/.github/workflows/deploy.yml@feat/gedeelde-workflows
    permissions:
      contents: read
      packages: write
    with:
      environment: prod
      infra-repo: ${{ vars.INFRA_REPO }}
      kustomize-path: ${{ vars.KUSTOMIZE_PATH }}
      images: '[{"name": "ghcr.io/developer-overheid-nl/don-api-tools"}]'
    secrets: inherit
