name: OAS ADR validation

on:
  pull_request:
    paths:
      - "api/openapi.yaml"
      - "scripts/generate-api.mjs"
      - ".github/workflows/oas-adr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Installed globally: npx would resolve don-checker against this repo's
      # package-lock.json (it is a transitive dependency of don-tools) and fail.
      - name: Install DON Checker
        run: npm install --global @developer-overheid-nl/don-checker@1.3.1

      - name: Validate OpenAPI against DON ADR
        run: |
          don-checker validate \
            --standard adr \
            --version 2.2.0 \
            --input api/openapi.yaml \
            --format table \
            --fail-on error
