name: OAS ADR validation

on:
  pull_request:
    paths:
      - "api/openapi.yaml"
      - "scripts/generate-api.mjs"
      - ".github/workflows/oas-adr.yml"
  workflow_dispatch:

jobs:
  validate:
    uses: developer-overheid-nl/.github/.github/workflows/oas-adr.yml@v1
    permissions:
      contents: read
    with:
      openapi-file: api/openapi.yaml
